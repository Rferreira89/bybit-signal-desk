<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Signal Desk Office</title>
<style>
  :root {
    --bg: #070a10;
    --panel: #11151c;
    --border: #1f2630;
    --text: #e8eef6;
    --muted: #8a95a5;
    --green: #3dd68c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .top {
    position: absolute; top: 0; left: 0; right: 0; z-index: 20;
    padding: 18px 20px 12px;
    background: linear-gradient(to bottom, rgba(7,10,16,0.95), transparent);
    display: flex; justify-content: space-between; align-items: center;
  }
  .top h1 { font-size: 20px; font-weight: 700; }
  .live { font-size: 12px; color: var(--green); display: flex; align-items: center; gap: 6px; }
  .live::before { content: ""; width: 7px; height: 7px; background: var(--green); border-radius: 50%; }
  .metrics {
    position: absolute; top: 62px; left: 12px; right: 12px; z-index: 20;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .metric {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px 6px; text-align: center;
  }
  .metric .l { font-size: 10px; color: var(--muted); }
  .metric .v { font-size: 15px; font-weight: 650; margin-top: 2px; }
  .scene {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .iso {
    width: 680px; height: 480px;
    position: relative;
    transform: rotateX(58deg) rotateZ(-28deg);
  }
  .room {
    position: absolute;
    background: rgba(17,21,28,0.8);
    border: 1.5px solid #2a3340;
    border-radius: 6px;
  }
  .room::before {
    content: attr(data-name);
    position: absolute; top: -26px; left: 50%; transform: translateX(-50%);
    background: #1a2029; color: #c5cdd8; font-size: 11px; font-weight: 600;
    padding: 3px 9px; border-radius: 6px; white-space: nowrap;
  }
  .person {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff;
  }
  .person.active { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .side {
    position: absolute; right: 10px; top: 150px; bottom: 70px; width: 190px; z-index: 20;
    background: rgba(17,21,28,0.95); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px;
  }
  .side h3 { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 8px; }
  .bar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
    background: #11151c; border-top: 1px solid var(--border);
    padding: 14px; text-align: center; font-size: 13px; color: var(--muted);
  }
</style>
</head>
<body>
<div class="top">
  <h1>Signal Desk</h1>
  <div class="live">Online · USDC</div>
</div>

<div class="metrics">
  <div class="metric"><div class="l">Capital</div><div class="v">87</div></div>
  <div class="metric"><div class="l">Sinais</div><div class="v">0</div></div>
  <div class="metric"><div class="l">Scan</div><div class="v">15m</div></div>
  <div class="metric"><div class="l">Filtro</div><div class="v">Alto</div></div>
</div>

<div class="scene">
  <div class="iso">
    <div class="room" data-name="Reunião" style="left:30px; top:30px; width:200px; height:140px;"></div>
    <div class="person active" style="left:100px; top:70px; background:#4c9aff;">A</div>
    <div class="person" style="left:60px; top:100px; background:#a78bfa;">R</div>

    <div class="room" data-name="Café" style="left:250px; top:20px; width:160px; height:120px;"></div>
    <div class="person" style="left:310px; top:60px; background:#ffb020;">S</div>

    <div class="room" data-name="Análise" style="left:20px; top:190px; width:260px; height:180px;"></div>
    <div class="person active" style="left:70px; top:230px; background:#3dd68c;">C</div>
    <div class="person active" style="left:140px; top:250px; background:#60a5fa;">M</div>
    <div class="person" style="left:200px; top:290px; background:#ff6b6b;">E</div>

    <div class="room" data-name="Comando" style="left:300px; top:180px; width:280px; height:200px;"></div>
    <div class="person active" style="left:360px; top:230px; background:#c084fc;">P</div>
    <div class="person" style="left:440px; top:270px; background:#fb923c;">X</div>
  </div>
</div>

<div class="side">
  <h3>Últimos sinais</h3>
  <div class="empty">Aguardando setups de alta qualidade…</div>
</div>

<div class="bar">Centro de comando · Scan rigoroso a cada 15 min</div>
</body>
</html>
